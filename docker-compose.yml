version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: proofpath
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/proofpath
      JWT_SECRET: proofpath-jwt-super-secret-key-prod-32chars
      JWT_EXPIRE_MINUTES: 60
      CONSENT_SECRET: proofpath-consent-super-secret-key-prod-32
      LLM_BASE_URL: https://api.groq.com/openai/v1
      LLM_API_KEY: ${LLM_API_KEY:-mock}
      LLM_MODEL: llama-3.3-70b-versatile
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      FRONTEND_ORIGIN: http://localhost:5173
      SANDBOX_MODE: off
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
